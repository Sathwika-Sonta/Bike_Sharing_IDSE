<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Data Dash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
:root{--bg:#10243a;--ink:#14263b;--paper:#fff8e8;--line:#e3d5b0;--teal:#1b9e8c;--org:#e8872a;--pur:#7b5cc9;--red:#d6402f;--grn:#2e9e4f;--gold:#f5b82e}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
.app{max-width:520px;margin:0 auto;height:calc(100dvh - 16px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:420px;display:flex;flex-direction:column;gap:8px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff;font-weight:600;font-size:16px}
.hud .z{flex:1;text-align:center;font-size:14px;opacity:.9;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hearts{letter-spacing:2px;color:#ff6b5e;font-size:20px;min-width:70px}
.stage{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;background:#7fd3ff;box-shadow:0 6px 24px #0008}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.card{position:absolute;left:8px;right:8px;top:8px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;box-shadow:0 4px 0 #0005}
.card .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a6a2a;font-weight:700}
.card .q{font-size:16px;font-weight:600;line-height:1.25;margin:2px 0 6px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{border-radius:10px;border:3px solid;padding:4px 2px;text-align:center;font-weight:700;font-size:17px;color:#fff;line-height:1.1}
.chip small{display:block;font-size:11px;font-weight:600;opacity:.9}
.toast{position:absolute;left:8px;right:8px;top:8px;border-radius:14px;padding:10px 12px;color:#fff;font-size:15px;line-height:1.3;border:3px solid var(--ink);box-shadow:0 4px 0 #0005}
.toast b{display:block;font-size:20px}
.toast.ok{background:var(--grn)}.toast.no{background:var(--red)}
.modal{position:absolute;inset:0;background:#0b1a2ccc;display:flex;align-items:center;justify-content:center;padding:12px}
.sheet{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:16px;max-width:100%;max-height:100%;overflow:auto;box-shadow:0 6px 0 #0006}
.sheet h2{margin:0 0 6px;font-size:26px;text-wrap:balance}
.sheet p{margin:6px 0;font-size:16px;line-height:1.35}
.sheet .lab{display:inline-block;min-width:78px;font-weight:700;color:#a14a12}
.btn{margin-top:10px;width:100%;font:inherit;font-weight:700;font-size:20px;padding:12px;border-radius:14px;border:3px solid var(--ink);background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.cols{display:grid;gap:8px}
.box{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.box h3{margin:0 0 2px;font-size:18px}
.ctl{display:flex;gap:8px}
.ctl button{flex:1;font:inherit;font-weight:700;font-size:22px;padding:8px;border-radius:14px;border:3px solid #fff3;background:#ffffff1c;color:#fff;touch-action:manipulation}
.ctl button:active{background:#ffffff40}
.hint{font-size:13px;color:#cfe3f5;text-align:center}
@media (max-width:360px){.card .q{font-size:14px}.chip{font-size:15px}}
</style>
<div class="app">
  <div class="hud"><span class="hearts" id="hearts">♥♥♥</span><span class="z" id="zone">Data Dash</span><span id="score">0</span></div>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div id="ui"></div></div>
  <div class="ctl"><button id="bL" aria-label="Left">◀</button><button id="bJ" aria-label="Jump">▲</button><button id="bR" aria-label="Right">▶</button></div>
  <div class="hint">Swipe left or right to change lane. Swipe up or tap to jump. Keys: arrows or A D, W or Space.</div>
</div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),g=cv.getContext('2d'),ui=$('#ui');
let W=0,H=0,DPR=1;
function resize(){const r=$('#stage').getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0)}
new ResizeObserver(resize).observe($('#stage'));resize();
const LC=['#1b9e8c','#e8872a','#7b5cc9'],LN=['Left','Middle','Right'],Z0=9,FAR=95;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)],shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
/* ---------- sound ---------- */
let ac=null,mute=false;
function beep(f,d=.1,t='square',v=.05,f2){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),gn=ac.createGain();o.type=t;o.frequency.value=f;if(f2)o.frequency.linearRampToValueAtTime(f2,ac.currentTime+d);gn.gain.value=v;gn.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(gn);gn.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const sfx={jump:()=>beep(300,.15,'square',.04,600),coin:()=>beep(880,.08,'triangle',.05,1200),ok:()=>{beep(523,.1,'triangle',.07);setTimeout(()=>beep(784,.18,'triangle',.07),100)},no:()=>beep(160,.3,'sawtooth',.06,90),hit:()=>beep(120,.2,'square',.07,60)};
/* ---------- questions ---------- */
const ZN=['Zone 1: Grouping (K-Means)','Zone 2: Odd one out (Isolation Forest)'];
const SEQ=['near','near','near','mean','near','mean','odd','odd','odd','mix','odd','mix'];
function qNear(){
  let cs;do{cs=[rnd(1,13),rnd(1,13),rnd(1,13)].sort((a,b)=>a-b)}while(cs[1]-cs[0]<3||cs[2]-cs[1]<3);
  let x,d;do{x=rnd(1,14);d=cs.map(c=>Math.abs(x-c));const s=d.slice().sort((a,b)=>a-b);if(!cs.includes(x)&&s[1]-s[0]>=1)break}while(true);
  const L=['A','B','C'],ord=shuf([0,1,2]),ch=ord.map(i=>({big:L[i]+' = '+cs[i],small:'Group '+L[i]+' center',v:i})),
  best=d.indexOf(Math.min(...d));
  return{kind:'near',zone:0,text:`A new creature has Size <b>${x}</b>. Run into the lane of the <b>closest</b> group center.`,chips:ch,correct:ord.indexOf(best),
   expl:`Distances from ${x}: ${L.map((l,i)=>l+' = '+d[i]).join(', ')}. ${L[best]} is closest, so the creature joins Group ${L[best]}.`,
   learn:'K-Means puts each item into the group with the nearest center.'};
}
function qMean(){
  let a,b,c,m;do{m=rnd(3,9);a=rnd(1,13);b=rnd(1,13);c=3*m-a-b}while(c<1||c>14||new Set([a,b,c]).size<3);
  const wrong=[Math.max(a,b,c),Math.min(a,b,c)].filter(v=>v!==m);while(wrong.length<2){const v=rnd(1,14);if(v!==m&&!wrong.includes(v))wrong.push(v)}
  const vals=shuf([m,wrong[0],wrong[1]]);
  return{kind:'mean',zone:0,text:`Group A has creatures of Size <b>${a}, ${b}, ${c}</b>. Move its center to the <b>average</b>. Which lane?`,
   chips:vals.map(v=>({big:String(v),small:'new center'})),correct:vals.indexOf(m),
   expl:`Average = (${a} + ${b} + ${c}) / 3 = ${m}. After the creatures join, the center moves to the average of its group.`,
   learn:'K-Means then moves each center to the average of its group, and repeats.'};
}
function qOdd(){
  const base=rnd(30,60);let o=base+pick([-1,1])*rnd(28,38);o=Math.max(5,Math.min(98,o));
  let n1=base+rnd(-4,4),n2=base+rnd(-4,4);const vals=[n1,n2,o],ord=shuf([0,1,2]),sh=ord.map(i=>vals[i]);
  const lo=Math.min(n1,n2),hi=Math.max(n1,n2);
  return{kind:'odd',zone:1,text:`Three river signals have a Beat of <b>${sh.join(', ')}</b>. Which one is the <b>odd one</b>?`,
   chips:sh.map(v=>({big:String(v),small:'signal'})),correct:ord.indexOf(2),
   expl:`${o} is far from ${n1} and ${n2}. One random cut between ${o>hi?hi:o} and ${o>hi?o:lo} puts it alone in 1 step. Normal values need many cuts.`,
   learn:'Odd values get alone after very few random cuts.'};
}
const mk={near:qNear,mean:qMean,odd:qOdd};
/* ---------- state ---------- */
let S,mode='title',timers=[];
function fresh(){S={dist:0,speed:12,lane:1,laneX:1,jt:-1,jh:0,hearts:3,score:0,coins:0,streak:0,inv:0,shake:0,cursor:30,nextGate:100,gates:[],gSpawned:0,gDone:0,obs:[],coin:[],sc:[],scCur:0,res:{near:[0,0],mean:[0,0],odd:[0,0]},cardGate:null,toast:null,t:0}}
fresh();
/* ---------- spawn ---------- */
function spawn(){
  while(S.cursor<S.dist+FAR-5){
    if(S.gSpawned<SEQ.length&&S.cursor>=S.nextGate){
      let t=SEQ[S.gSpawned];if(t==='mix')t=pick(['near','mean','odd']);
      const q=mk[t]();S.gates.push({w:S.cursor,q,done:false,pick:-1,flash:0,i:S.gSpawned});S.gSpawned++;S.nextGate=S.cursor+150;S.cursor+=24;continue}
    if(S.gSpawned<SEQ.length&&S.cursor>S.nextGate-22){S.cursor+=4;continue}
    const k=Math.random(),l=rnd(0,2);
    if(k<.38){for(let i=0;i<5;i++)S.coin.push({w:S.cursor+i*2.4,lane:l,got:false});S.cursor+=14}
    else if(k<.7){S.obs.push({w:S.cursor,lane:l,type:'low',hit:false});const o=pick([0,1,2].filter(x=>x!==l));for(let i=0;i<4;i++)S.coin.push({w:S.cursor-4+i*2.4,lane:o,got:false});S.cursor+=12}
    else{S.obs.push({w:S.cursor,lane:l,type:'high',hit:false});const o=pick([0,1,2].filter(x=>x!==l));for(let i=0;i<4;i++)S.coin.push({w:S.cursor-3+i*2.4,lane:o,got:false});S.cursor+=13}
  }
  while(S.scCur<S.dist+FAR){S.sc.push({w:S.scCur,x:1+(Math.random()<.5?-1:1)*(2.1+Math.random()*1.3),k:rnd(0,2)});S.scCur+=rnd(5,9)}
}
/* ---------- gates ---------- */
function resolve(gt){
  gt.done=true;const q=gt.q,ok=S.lane===q.correct,r=S.res[q.kind];r[1]++;gt.pick=S.lane;gt.flash=2.5;S.gDone++;
  if(ok){r[0]++;S.streak++;S.score+=100+Math.min(S.streak-1,5)*20;sfx.ok();S.toast={cls:'ok',h:'Correct!'+(S.streak>1?' Streak x'+S.streak:''),t:q.expl,left:5}}
  else{S.streak=0;S.hearts--;S.shake=.4;sfx.no();S.toast={cls:'no',h:'Not quite',t:q.expl+' '+q.learn,left:6.5}}
  S.cardGate=null;refreshHud();
  if(S.hearts<=0){timers.push([2.2,()=>recap(true)]);return}
  if(S.gDone===6)timers.push([4.2,()=>intro(1)]);
  if(S.gDone===SEQ.length)timers.push([4.5,()=>recap(false)]);
}
/* ---------- projection ---------- */
const P=z=>Z0/(Z0+Math.max(z,-Z0*.85));
const lw=()=>W*.29,hor=()=>H*.30,gy=()=>H*.87,U=()=>H*.13;
const sx=(l,p)=>W/2+(l-1)*lw()*p,sy=p=>hor()+(gy()-hor())*p;
/* ---------- update ---------- */
function update(dt){
  S.t+=dt;S.speed=Math.min(19,12+S.dist/140);S.dist+=S.speed*dt;
  S.laneX+=(S.lane-S.laneX)*Math.min(1,dt*14);
  if(S.jt>=0){S.jt+=dt/.72;if(S.jt>=1)S.jt=-1}
  S.jh=S.jt>=0?Math.sin(Math.PI*S.jt):0;
  S.inv=Math.max(0,S.inv-dt);S.shake=Math.max(0,S.shake-dt);
  spawn();
  for(const o of S.obs){const z=o.w-S.dist;if(!o.hit&&z<.7&&z>-.7&&o.lane===S.lane&&S.inv<=0&&(o.type==='high'||S.jh<.5)){o.hit=true;S.hearts--;S.inv=1.3;S.shake=.35;S.streak=0;sfx.hit();refreshHud();if(S.hearts<=0){timers.push([1.2,()=>recap(true)]);mode='dying'}}}
  for(const c of S.coin){const z=c.w-S.dist;if(!c.got&&z<.8&&z>-.8&&c.lane===S.lane){c.got=true;S.coins++;S.score+=10;sfx.coin();refreshHud()}}
  for(const gt of S.gates){const z=gt.w-S.dist;if(!gt.done&&z<=0)resolve(gt);if(gt.flash>0)gt.flash-=dt}
  const nxt=S.gates.find(x=>!x.done);const show=nxt&&nxt.w-S.dist<62&&nxt.w-S.dist>0?nxt:null;
  if(show!==S.cardGate){S.cardGate=show;if(show&&S.toast)S.toast=null}
  S.obs=S.obs.filter(o=>o.w-S.dist>-6);S.coin=S.coin.filter(o=>o.w-S.dist>-6);S.sc=S.sc.filter(o=>o.w-S.dist>-6);S.gates=S.gates.filter(o=>o.w-S.dist>-10);
  if(S.toast){S.toast.left-=dt;if(S.toast.left<=0)S.toast=null}
  syncUi();
}
/* ---------- draw ---------- */
function draw(){
  const w=W,h=H,hz=hor();g.save();if(S.shake>0)g.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
  let gr=g.createLinearGradient(0,0,0,hz+10);gr.addColorStop(0,'#59b9f2');gr.addColorStop(1,'#d9f4ff');g.fillStyle=gr;g.fillRect(0,0,w,hz+10);
  g.fillStyle='#fff6c8';g.beginPath();g.arc(w*.78,hz*.45,h*.05,0,7);g.fill();
  g.fillStyle='#ffffffcc';for(let i=0;i<3;i++){const cx=((i*w*.45+S.t*8)%(w+120))-60,cy=hz*(.2+i*.18);g.beginPath();g.ellipse(cx,cy,34,12,0,0,7);g.ellipse(cx+22,cy+4,26,10,0,0,7);g.fill()}
  g.fillStyle='#4fa36b';g.beginPath();g.moveTo(0,hz+2);for(let x=0;x<=w;x+=20)g.lineTo(x,hz-14-Math.sin(x*.02+1)*10-Math.sin(x*.05)*6);g.lineTo(w,hz+2);g.fill();
  g.fillStyle='#6cc47f';g.fillRect(0,hz,w,h-hz);
  const band=4;for(let z=-(S.dist%(band*2));z<FAR;z+=band*2){const p1=P(z),p2=P(z+band);g.fillStyle='#62b975';g.fillRect(0,sy(p2),w,sy(p1)-sy(p2))}
  const pf=P(FAR),pn=1.3;g.fillStyle='#5a5f73';g.beginPath();g.moveTo(sx(-.5,pf),sy(pf));g.lineTo(sx(2.5,pf),sy(pf));g.lineTo(sx(2.5,pn),sy(pn));g.lineTo(sx(-.5,pn),sy(pn));g.fill();
  g.fillStyle='#f2c94c';for(const e of[-.5,2.5]){g.beginPath();g.moveTo(sx(e,pf)-1,sy(pf));g.lineTo(sx(e,pf)+1,sy(pf));g.lineTo(sx(e,pn)+5,sy(pn));g.lineTo(sx(e,pn)-5,sy(pn));g.fill()}
  g.fillStyle='#ffffffaa';for(let z=-(S.dist%6);z<FAR;z+=6){const p1=P(z),p2=P(z+2.8);for(const e of[.5,1.5]){g.beginPath();g.moveTo(sx(e,p1)-2.5*p1,sy(p1));g.lineTo(sx(e,p1)+2.5*p1,sy(p1));g.lineTo(sx(e,p2)+2.5*p2,sy(p2));g.lineTo(sx(e,p2)-2.5*p2,sy(p2));g.fill()}}
  const items=[];
  S.sc.forEach(o=>items.push({z:o.w-S.dist,f:()=>tree(o)}));
  S.obs.forEach(o=>items.push({z:o.w-S.dist,f:()=>obstacle(o)}));
  S.coin.forEach(o=>{if(!o.got)items.push({z:o.w-S.dist,f:()=>coinD(o)})});
  S.gates.forEach(o=>items.push({z:o.w-S.dist,f:()=>gateD(o)}));
  items.sort((a,b)=>b.z-a.z);
  for(const it of items){if(it.z>FAR||it.z<-Z0*.8)continue;it.f()}
  player();g.restore();
}
function tree(o){const z=o.w-S.dist,p=P(z),x=sx(o.x,p),y=sy(p),s=U()*p;
  g.fillStyle='#7a4e2b';g.fillRect(x-s*.12,y-s*1.1,s*.24,s*1.1);g.fillStyle=['#2f8f4e','#3aa35c','#277a45'][o.k];g.beginPath();g.arc(x,y-s*1.5,s*.75,0,7);g.arc(x-s*.4,y-s*1.2,s*.5,0,7);g.arc(x+s*.4,y-s*1.2,s*.5,0,7);g.fill()}
function box(lane,z,wU,hU,col,top){const p=P(z),cx=sx(lane,p),w=wU*lw()*p,h=hU*U()*p,y=sy(p),d=h*.14;
  g.fillStyle=col;g.fillRect(cx-w/2,y-h,w,h);g.fillStyle=top;g.fillRect(cx-w/2,y-h-d,w,d);return{cx,w,h,y,p}}
function obstacle(o){const z=o.w-S.dist;
  if(o.type==='low'){const b=box(o.lane,z,.8,.5,'#e0572f','#f58a5e');g.fillStyle='#fff';for(let i=0;i<4;i++){g.fillRect(b.cx-b.w/2+i*b.w/4+b.w*.04,b.y-b.h,b.w*.09,b.h)}g.fillStyle='#333';g.fillRect(b.cx-b.w/2,b.y,b.w*.1,b.h*.2);g.fillRect(b.cx+b.w*.4,b.y,b.w*.1,b.h*.2)}
  else{const b=box(o.lane,z,.85,1.7,'#5d6b86','#8394b4');g.fillStyle='#3d475c';g.fillRect(b.cx-b.w/2,b.y-b.h*.62,b.w,b.h*.06);g.fillStyle='#ffd24a';g.fillRect(b.cx-b.w*.28,b.y-b.h*.9,b.w*.56,b.h*.12)}}
function coinD(o){const z=o.w-S.dist,p=P(z),x=sx(o.lane,p),y=sy(p)-U()*p*(.55+Math.sin(S.t*5+o.w)*.06),r=U()*p*.2,sq=Math.abs(Math.cos(S.t*4+o.w));
  g.fillStyle='#f5b82e';g.beginPath();g.ellipse(x,y,r*(.35+.65*sq),r,0,0,7);g.fill();g.strokeStyle='#b57a0a';g.lineWidth=Math.max(1,r*.15);g.stroke()}
function gateD(gt){const z=gt.w-S.dist,p=P(z);if(p<=0)return;const q=gt.q,bot=U()*1.7*p,hh=U()*1.2*p,y0=sy(p);
  g.fillStyle='#2b3a52';for(const e of[-.5,.5,1.5,2.5]){const x=sx(e+0,p);g.fillRect(x-3*p-1,y0-bot-hh,6*p+2,bot+hh)}
  for(let i=0;i<3;i++){const x=sx(i,p),w=lw()*p*.96,c=q.chips[i];let col=LC[i];
    if(gt.done&&gt.flash>0){if(i===q.correct)col='#2e9e4f';else if(i===gt.pick)col='#d6402f'}
    g.fillStyle='#0003';g.fillRect(x-w/2+3,y0-bot-hh+4,w,hh);g.fillStyle=col;g.fillRect(x-w/2,y0-bot-hh,w,hh);g.strokeStyle='#fff';g.lineWidth=Math.max(1.5,3*p);g.strokeRect(x-w/2+2,y0-bot-hh+2,w-4,hh-4);
    g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.font=`700 ${Math.max(8,hh*.5)}px Fredoka,sans-serif`;g.fillText(c.big,x,y0-bot-hh*.5)}
}
function player(){
  const x=sx(S.laneX,1),f=gy(),s=U()*.95,y=f-S.jh*U()*1.15,ph=S.dist*1.1,blink=S.inv>0&&Math.floor(S.t*14)%2===0;
  g.fillStyle='#0004';g.beginPath();g.ellipse(x,f+4,s*.42*(1-S.jh*.35),s*.1,0,0,7);g.fill();
  if(blink)return;
  const sw=S.jt>=0?.3:Math.sin(ph*2.2);
  g.lineCap='round';g.strokeStyle='#2c3e66';g.lineWidth=s*.2;
  g.beginPath();g.moveTo(x-s*.12,y-s*.55);g.lineTo(x-s*.12-sw*s*.28,y-s*.02);g.stroke();
  g.beginPath();g.moveTo(x+s*.12,y-s*.55);g.lineTo(x+s*.12+sw*s*.28,y-s*.02);g.stroke();
  g.fillStyle='#16806f';g.fillRect(x-s*.36,y-s*1.12,s*.26,s*.55);
  g.fillStyle='#ef8a2b';g.beginPath();g.roundRect(x-s*.26,y-s*1.15,s*.52,s*.65,s*.12);g.fill();
  g.strokeStyle='#f3c48f';g.lineWidth=s*.14;g.beginPath();g.moveTo(x+s*.24,y-s*.98);g.lineTo(x+s*.38+sw*s*.1,y-s*.7);g.stroke();
  g.fillStyle='#f3c48f';g.beginPath();g.arc(x,y-s*1.4,s*.27,0,7);g.fill();
  g.fillStyle='#f5b82e';g.beginPath();g.arc(x,y-s*1.45,s*.29,Math.PI,0);g.fill();g.fillRect(x-s*.02,y-s*1.5,s*.4,s*.09);
  g.fillStyle='#222';g.beginPath();g.arc(x+s*.1,y-s*1.38,s*.04,0,7);g.fill();
}
/* ---------- ui ---------- */
function refreshHud(){$('#hearts').textContent='♥'.repeat(Math.max(0,S.hearts))+'♡'.repeat(Math.max(0,3-S.hearts));$('#score').textContent=S.score;
  const z=S.gDone>=6?1:0;$('#zone').textContent='Zone '+(z+1)+' · Gate '+Math.min(S.gDone+1,SEQ.length)+'/'+SEQ.length}
let lastUi='';
function syncUi(){
  let h='';
  if(S.cardGate){const q=S.cardGate.q;h=`<div class="card"><div class="tag">${ZN[q.zone]}</div><div class="q">${q.text}</div><div class="chips">${q.chips.map((c,i)=>`<div class="chip" style="background:${LC[i]};border-color:${S.lane===i?'#fff':LC[i]}">${c.big}<small>${LN[i]}</small></div>`).join('')}</div></div>`}
  else if(S.toast){h=`<div class="toast ${S.toast.cls}"><b>${S.toast.h}</b>${S.toast.t}</div>`}
  if(h!==lastUi){ui.innerHTML=h;lastUi=h}
}
function modal(html,btn,cb){mode='modal';lastUi='';ui.innerHTML=`<div class="modal"><div class="sheet">${html}<button class="btn" id="mb">${btn}</button></div></div>`;$('#mb').onclick=()=>{ui.innerHTML='';lastUi='';mode='play';sfx.jump();cb&&cb()}}
function intro(z){
  const t=z===0?
  [`<h2>Zone 1: Grouping</h2>`,`<p><span class="lab">Goal:</span>Run through 6 gates. Pick the right lane at each one.</p><p><span class="lab">How:</span>Each gate shows 3 numbers, one per lane. Read the question at the top, then steer into the correct lane. Jump over barriers. Dodge the big crates.</p><p><span class="lab">Why:</span>This is <b>K-Means</b>. A computer makes groups by 2 simple steps: put each item in the group with the <b>closest center</b>, then move each center to the <b>average</b> of its group.</p>`]
  :[`<h2>Zone 2: Odd one out</h2>`,`<p><span class="lab">Goal:</span>Find the odd signal at each gate.</p><p><span class="lab">How:</span>Three numbers show up, one per lane. Two are close to each other. One is far away. Steer into the far one.</p><p><span class="lab">Why:</span>This is <b>Isolation Forest</b>. It cuts the numbers with random lines. An odd number gets alone after very few cuts. Banks use this idea to catch fraud.</p>`];
  modal(t[0]+t[1],z===0?'Start running!':'Keep running!')
}
function recap(dead){
  mode='modal';const r=S.res,pc=(a)=>a[1]?`${a[0]} of ${a[1]} right`:'not played',g1=[r.near[0]+r.mean[0],r.near[1]+r.mean[1]];
  let best=+localStorage.getItem('dd-best')||0;try{if(S.score>best){best=S.score;localStorage.setItem('dd-best',best)}}catch(e){}
  ui.innerHTML=`<div class="modal"><div class="sheet"><h2>${dead?'Out of hearts!':'You finished!'}</h2><p>Score <b>${S.score}</b> · Coins <b>${S.coins}</b> · Best <b>${best}</b></p>
  <div class="cols"><div class="box"><h3>Skill 1: Grouping (K-Means)</h3><p><span class="lab">You got:</span>${pc(g1)}</p><p><span class="lab">You did:</span>Closest center, then move the center to the average.</p><p><span class="lab">Real life:</span>Shops group similar customers. Music apps group similar songs.</p></div>
  <div class="box"><h3>Skill 2: Odd one out (Isolation Forest)</h3><p><span class="lab">You got:</span>${pc(r.odd)}</p><p><span class="lab">You did:</span>Found the number that was far from the rest.</p><p><span class="lab">Real life:</span>Banks catch fraud. Factories find broken machines.</p></div>
  <div class="box"><h3>Together</h3><p>Grouping shows what is normal. Odd-one-out finds what is not. Data scientists use both to turn lots of numbers into answers.</p></div></div>
  <button class="btn" id="mb">${dead?'Try again':'Play again'}</button></div></div>`;
  $('#mb').onclick=()=>{start()}
}
function start(){fresh();timers=[];lastUi='';refreshHud();intro(0);mode='modal'}
/* ---------- input ---------- */
function move(d){if(mode!=='play')return;S.lane=Math.max(0,Math.min(2,S.lane+d));beep(420,.05,'triangle',.03)}
function jump(){if(mode==='play'&&S.jt<0){S.jt=0;sfx.jump()}}
addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A')move(-1);else if(k==='ArrowRight'||k==='d'||k==='D')move(1);else if(k==='ArrowUp'||k==='w'||k==='W'||k===' ')jump();else if(k==='Enter'){const b=$('#mb');if(b)b.click()}if(k.startsWith('Arrow')||k===' ')e.preventDefault()});
$('#bL').onclick=()=>move(-1);$('#bR').onclick=()=>move(1);$('#bJ').onclick=jump;
let tx=0,ty=0,tt=0;
cv.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;tt=Date.now()},{passive:true});
cv.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(Math.abs(dx)>28&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<-28)jump();else if(Math.abs(dx)<12&&Math.abs(dy)<12)jump()},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'){last=0}});
/* ---------- loop ---------- */
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last){last=ts}let dt=Math.min(.05,(ts-last)/1000);last=ts;
  if(mode==='play'||mode==='dying'){update(dt);for(let i=timers.length-1;i>=0;i--){timers[i][0]-=dt;if(timers[i][0]<=0){const f=timers[i][1];timers.splice(i,1);f()}}}
  draw();
}
/* ---------- title ---------- */
mode='modal';
ui.innerHTML=`<div class="modal"><div class="sheet"><h2>Data Dash</h2><p>Run through the data city. At each gate, pick the right lane to learn two data science skills by playing.</p>
<div class="cols"><div class="box"><h3>Skill 1: Grouping</h3><p>K-Means: put things in the closest group.</p></div><div class="box"><h3>Skill 2: Odd one out</h3><p>Isolation Forest: find the number that does not fit.</p></div></div><button class="btn" id="mb">Play</button></div></div>`;
$('#mb').onclick=start;
window.__DD={get S(){return S},get mode(){return mode},resolve};
requestAnimationFrame(loop);
</script>

</body></html>
